<!DOCTYPE html>
<html>

<head>
    <script src="./data/jroberts.js"></script>
    <script src="./scripts/itemRenderer.js"></script>

    <title>James Roberts's Shop</title>

    <link rel="icon" type="image/x-icon" href="./images/shield.png">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
        crossorigin="anonymous">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        crossorigin="anonymous"
        referrerpolicy="no-referrer" />

    <!-- Google Fonts: old-timey western / country -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Rye&family=Special+Elite&display=swap">

    <style>
        /* ---- Cracker Barrel-ish palette ---- */
        :root {
            --cb-wood-dark: #2e1a0c;
            --cb-wood-mid: #5a3620;
            --cb-gold: #f0b323;
            --cb-gold-soft: #e8cf92;
            --cb-brown: #6b4423;
            --cb-cream: #f7f0e1;
        }

        .mule-icon {
            color: var(--cb-gold);
            font-size: 3rem;
            text-shadow: 0 2px 3px rgba(0, 0, 0, 0.6);
        }

        /* Mirror one mule so the pair faces the sign */
        .mule-icon.flip {
            transform: scaleX(-1);
        }

        /* ---- Wood-grain sign for the title row ---- */
        #heading {
            background-color: var(--cb-wood-mid);
            background-image:
                /* fine grain lines */
                repeating-linear-gradient(to bottom,
                    rgba(0, 0, 0, 0.22) 0 1px,
                    rgba(255, 255, 255, 0.03) 1px 2px,
                    transparent 2px 6px),
                /* coarser growth rings */
                repeating-linear-gradient(to bottom,
                    rgba(0, 0, 0, 0.16) 0 2px,
                    transparent 2px 19px),
                /* knots */
                radial-gradient(ellipse 120px 26px at 12% 34%, rgba(0, 0, 0, 0.42), transparent 70%),
                radial-gradient(ellipse 150px 30px at 82% 72%, rgba(0, 0, 0, 0.35), transparent 70%),
                /* plank color variation */
                linear-gradient(to bottom,
                    #4a2c17 0%,
                    #6b4222 22%,
                    #3d230f 46%,
                    #6f4526 72%,
                    #331d0c 100%);
            border-top: 6px solid var(--cb-gold);
            border-bottom: 6px solid var(--cb-gold);
            box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.55);
        }

        .store-title {
            color: var(--cb-gold);
            font-family: 'Rye', Georgia, 'Times New Roman', Times, serif;
            font-weight: normal;
            letter-spacing: 0.02em;
            margin-bottom: 0.35rem;
            text-shadow:
                0 1px 0 rgba(0, 0, 0, 0.9),
                0 3px 6px rgba(0, 0, 0, 0.7);
        }

        .store-subtitle {
            color: var(--cb-gold-soft);
            font-family: 'Special Elite', Georgia, serif;
            font-style: normal;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        /* ---- Shop floor ---- */
        #container-main {
            background-color: var(--cb-cream);
        }

        /* Item cards come from scripts/itemRenderer.js (shared), so retheme
           the Bootstrap utility classes it emits, scoped to this page. */
        #container-main .border-info {
            border-color: var(--cb-brown) !important;
            border-width: 2px !important;
        }

        /* Card background is left to Bootstrap's .bg-light on purpose: many item
           images have a white background, and matching it keeps them borderless. */
        #container-main .bg-light {
            box-shadow: 0 2px 6px rgba(46, 26, 12, 0.18);
        }

        #container-main .text-muted {
            color: var(--cb-wood-dark) !important;
        }

        #container-main .text-secondary {
            color: #5c4632 !important;
        }

        #container-main .h1 {
            font-family: 'Rye', Georgia, serif;
            color: var(--cb-wood-dark) !important;
        }

        #container-main hr {
            border-top: 3px solid var(--cb-brown);
            opacity: 0.7;
        }
    </style>
</head>

<body>
    <div id="heading" class="text-center px-5 py-3">

        <!-- Title Row -->
        <div class="d-flex justify-content-center align-items-center gap-4 flex-wrap">
            <i class="fa-brands fa-sticker-mule mule-icon flip"></i>

            <div>
                <p class="h1 store-title">
                    James Roberts's Country Store
                </p>

                <p class="h2 store-subtitle mb-0">
                    Everything one could need from the back of a mule
                </p>
            </div>

            <i class="fa-brands fa-sticker-mule mule-icon"></i>
        </div>
    </div>

    <div class="container-fluid px-5 py-2" id="container-main">

        <div style="display: none" id="header-row-1">
            <hr>
            <div class="h1 text-muted">In Stock</div>
        </div>

        <div class="row" id="container-row-1">
        </div>

        <div style="display: none" id="header-row-2">
            <hr>
            <div class="h1 text-muted">Sold Out</div>
        </div>

        <div class="row" id="container-row-2">
        </div>

        <div style="display: none" id="header-row-3">
            <hr>
            <div class="h1 text-muted">Not Available</div>
        </div>

        <div class="row" id="container-row-3">
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>

    <script>
        renderItems(data);
    </script>
</body>

</html>
